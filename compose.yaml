services:

  app:
    build:
      context: .

    ports:
      - "8501:8501"

    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      PREFECT_API_URL: http://prefect:4200/api
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_EMBEDDING_DIMENSIONS: ${OPENAI_EMBEDDING_DIMENSIONS:-512}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-5-mini}
      METEORA_API_BASE_URL: ${METEORA_API_BASE_URL:-https://dlmm.datapi.meteora.ag}
      APP_DB_PATH: ${APP_DB_PATH:-data/application.db}

    depends_on:
      elasticsearch:
        condition: service_healthy
      prefect:
        condition: service_started

    volumes:
      - ./data:/app/data
      - ./evaluation:/app/evaluation


  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.0

    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m

    ports:
      - "9200:9200"

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data


  prefect:
    image: prefecthq/prefect:3-latest

    command:
      - prefect
      - server
      - start
      - --host
      - 0.0.0.0

    ports:
      - "4200:4200"

    volumes:
      - prefect_data:/root/.prefect


volumes:
  elasticsearch_data:
  prefect_data:
