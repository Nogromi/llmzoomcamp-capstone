[project]
name = "dlmm-position-lab"
version = "0.1.0"
description = "A small Meteora DLMM documentation assistant with live pool lookup"
readme = "README.md"
authors = [
    { name = "Anatolii Kryvko", email = "anatolii.krivko@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "elasticsearch>=9.5.0",
    "httpx>=0.28.1",
    "openai>=3.3.0",
    "python-dotenv>=1.2.2",
    "streamlit>=1.61.1",
]

[build-system]
requires = ["uv_build>=0.11.30,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.2",
]
